version: '3.8'

services:
  # Контейнер з Базою Даних (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: fastapi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: fastapi_dev_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Контейнер з нашим FastAPI додатком
  web:
    build: .
    container_name: fastapi_web
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/fastapi_dev_db
    command: uvicorn fastapi_template.main:app --host 0.0.0.0 --port 8000 --app-dir src --reload
    depends_on:
      - db

volumes:
  postgres_data: